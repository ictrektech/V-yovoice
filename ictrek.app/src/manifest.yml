id: com.ictrek.v-voice
name:
  zh-CN: V-Voice
  en: V-Voice
description:
  zh-CN: 语音与音乐创作工作台，提供 ASR、声纹、声音克隆、TTS、歌曲与配乐生成、编曲、共享模型管理和标准 API；实时对话支持 AMD CUDA、Jetson / L4T 与 Thor。
  en: Speech and music studio with ASR, speaker recognition, voice cloning, TTS, songs, background music, scores, shared models and standard APIs; realtime dialogue supports AMD CUDA, Jetson / L4T and Thor.
version: __APP_VERSION__
author: ictrek
oauth2:
  client:
    id: com.ictrek.v-voice
    client_type: public
    grant_types: [authorization_code, refresh_token]
    response_types: [code]
    scopes: [openid, profile, email]
    pkce_required: true
    token_endpoint_auth_method: none
category: [ai]
icon: icon.png
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.v-voice

platform:
  version: ">=3.0.0"

dependencies:
  apps:
    - id: com.ictrek.v-scheduler
      version: latest
      optional: false

permissions:
  defines:
    - code: com.ictrek.v-voice:model:manage
      name:
        zh-CN: 管理公共语音模型
        en: Manage Public Voice Models
      description:
        zh-CN: 允许管理员通过 V-Scheduler 安装、更新和停止 V-Voice 公共模型。
        en: Allows administrators to install, update, and stop public V-Voice models through V-Scheduler.
      default_roles: [system_admin, platform_admin]

profiles:
  - name: amd-cpu
    title: {zh-CN: AMD64 CPU, en: AMD64 CPU}
    description: {zh-CN: AMD64 CPU 推理。, en: AMD64 CPU inference.}
    caps: {arch: amd64}
    conflicts: [amd-cuda, arm-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: amd-cuda
    title: {zh-CN: AMD64 CUDA, en: AMD64 CUDA}
    description: {zh-CN: AMD64 NVIDIA CUDA 加速。, en: AMD64 NVIDIA CUDA acceleration.}
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-cpu, arm-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cpu
    title: {zh-CN: ARM64 CPU, en: ARM64 CPU}
    description: {zh-CN: ARM64 CPU 推理。, en: ARM64 CPU inference.}
    caps: {arch: arm64}
    conflicts: [amd-cpu, amd-cuda, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cuda
    title: {zh-CN: ARM64 CUDA, en: ARM64 CUDA}
    description: {zh-CN: 通用 ARM64 NVIDIA CUDA 加速。, en: Generic ARM64 NVIDIA CUDA acceleration.}
    caps:
      device-type: generic
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: jetson-orin
    title: {zh-CN: Jetson Orin, en: Jetson Orin}
    description: {zh-CN: Jetson Orin CUDA 加速。, en: Jetson Orin CUDA acceleration.}
    caps:
      device-type:
        - any-of: [jetson-orin, l4t, jetson]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-thor, dgx-spark]
  - name: jetson-thor
    title: {zh-CN: Jetson Thor, en: Jetson Thor}
    description: {zh-CN: Jetson Thor CUDA 加速。, en: Jetson Thor CUDA acceleration.}
    caps:
      device-type:
        - any-of: [jetson-thor, thor, thor-spark]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-orin, dgx-spark]
  - name: dgx-spark
    title: {zh-CN: DGX Spark, en: DGX Spark}
    description: {zh-CN: NVIDIA GB10 CUDA 加速。, en: NVIDIA GB10 CUDA acceleration.}
    caps:
      device-type:
        - any-of: [dgx-spark, spark]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-orin, jetson-thor]

require-profiles: true

storage:
  directories:
    - path: data
      mode: "0755"
