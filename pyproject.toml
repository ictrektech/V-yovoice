[project]
name = "v-voice"
version = "0.1.0"
description = "Shared ASR and TTS service with ONNX and native audio.cpp inference"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.12,<1",
  "kaldi-native-fbank==1.22.3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
runtime = ["sherpa-onnx>=1.12"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "PyYAML>=6,<7"]
export-seaco = ["funasr==1.2.6", "onnx==1.17.0", "torch==2.11.0", "torchaudio==2.11.0", "onnxruntime==1.23.2", "modelscope-hub==0.4.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vvoice"]

[tool.setuptools.package-data]
vvoice = ["assets/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"
