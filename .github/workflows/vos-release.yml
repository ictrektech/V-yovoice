name: VOS Pull Package Release

on:
  workflow_dispatch:
    inputs:
      retry_version:
        description: 'Retry the current failed, unpublished VOS version without moving its trigger tag; leave blank for dependency preflight'
        required: false
        default: ''
        type: string
  push:
    tags:
      - "vos-v-voice-v*"

permissions:
  contents: write

jobs:
  dependency-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.retry_version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install pyyaml
      - name: Connect approved App Store tunnel
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh open
      - name: Verify live published dependencies without packaging or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s ictrek.app/scripts -p 'test_package_dependencies.py'
          python - <<'PY'
          import importlib.util, pathlib, yaml
          spec = importlib.util.spec_from_file_location('package', 'ictrek.app/scripts/package.py')
          package = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(package)
          package.resolve_dependencies(yaml.safe_load(pathlib.Path('ictrek.app/src/manifest.yml').read_text()))
          PY
      - name: Close App Store tunnel
        if: always()
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh close

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.retry_version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch all release tags
        run: git fetch --force --tags origin

      - name: Resolve and guard release version
        env:
          REQUESTED_RETRY_VERSION: ${{ inputs.retry_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            VERSION="${GITHUB_REF_NAME#vos-v-voice-v}"
          else
            VERSION="$REQUESTED_RETRY_VERSION"
            [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$(tr -d '[:space:]' < ictrek.app/VERSION)" == "$VERSION" ]]
            git rev-parse --verify "refs/tags/vos-v-voice-v${VERSION}^{commit}" >/dev/null
            PUBLIC_REF="$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
            [[ -z "$PUBLIC_REF" ]] || { echo 'Manual retry refuses an already published version.' >&2; exit 1; }
          fi
          printf 'VOS_RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Write Feishu credentials
        run: |
          cat > "$HOME/.feishu.components.json" <<EOF
          {"feishu_app_id":"${{ secrets.FEISHU_APP_ID }}","feishu_app_secret":"${{ secrets.FEISHU_APP_SECRET }}"}
          EOF
          chmod 600 "$HOME/.feishu.components.json"

      - name: Install audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test backend
        run: |
          python -m pip install '.[test]'
          python -m pytest -q

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test creation backend
        run: |
          go test -race ./...

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test and build creation workbench
        run: |
          npm install --global pnpm@9.15.2
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run lint
          VITE_VOS=true pnpm --dir web run build
          grep -q '<title>V-Voice</title>' web/dist/index.html
          cmp ictrek.app/src/icon.png web/dist/v-voice.png
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web test
          VITE_VOS=true PLAYWRIGHT_TEST_PORT=4187 pnpm --dir web exec playwright test browser-tests/native-music.spec.ts

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Verify packaging dependency resolver
        run: python -m unittest discover -s ictrek.app/scripts -p 'test_package_dependencies.py'

      - name: Connect approved App Store tunnel
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh open

      - name: Build pull package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$VOS_RELEASE_VERSION"
          PACKAGE_VERSION="$VERSION" ./ictrek.app/scripts/package.sh
          test -f "ictrek.app/dist/v_voice_${VERSION}_pull.tar"

      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: vos-v-voice-v
        run: |
          set -euo pipefail
          VERSION="$VOS_RELEASE_VERSION"
          CURRENT="$GITHUB_SHA"
          PUBLIC_TAG="v${VERSION}"
          export PUBLIC_TAG
          python3 scripts/release-notes.py "$PUBLIC_TAG" > changelog-notes.md
          grep -q '^### English' changelog-notes.md
          grep -q '^### 简体中文' changelog-notes.md
          PREVIOUS="$(gh release list --limit 100 --json tagName,publishedAt --jq '[.[] | select(.tagName != env.PUBLIC_TAG) | select((.tagName | startswith("v")) or (.tagName | startswith(env.TAG_PREFIX)))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          {
            echo "Pull-mode VOS app package for com.ictrek.v-voice."
            echo
            cat changelog-notes.md
            echo
            if [[ -n "$PREVIOUS" ]]; then
              echo "Changes since ${PREVIOUS}:"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..${CURRENT}"
            else
              echo "Initial VOS package release."
              git log --no-merges --pretty='- %s (%h)' -20 "${CURRENT}"
            fi
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$VOS_RELEASE_VERSION"
          PUBLIC_TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${PUBLIC_TAG}" >/dev/null 2>&1; then
            git tag "$PUBLIC_TAG" "$GITHUB_SHA"
            git push origin "$PUBLIC_TAG"
          fi
          if gh release view "$PUBLIC_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "${PUBLIC_TAG}^{commit}")" = "$GITHUB_SHA"
            gh release download "$PUBLIC_TAG" --pattern "v_voice_${VERSION}_pull.tar" --dir ictrek.app/dist --clobber
          else
            gh release create "$PUBLIC_TAG" "ictrek.app/dist/v_voice_${VERSION}_pull.tar" \
              --verify-tag --latest --title "v${VERSION}" --notes-file release-notes.md
          fi

      - name: Publish package to VOS App Store
        run: |
          set -euo pipefail
          VERSION="$VOS_RELEASE_VERSION"
          PACKAGE="ictrek.app/dist/v_voice_${VERSION}_pull.tar"
          response="$(curl -kfsS -F "package=@${PACKAGE}" -F "force=true" -F "channel=stable" "http://127.0.0.1:18899/api/appstore/apps")" \
            || response="$(curl -kfsS -F "package=@${PACKAGE}" -F "force=true" "http://127.0.0.1:18899/api/appstore/apps")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("code") != 0:
              raise SystemExit(value)
          print('PASS: App Store accepted published package')
          PY
          curl -fsS --max-time 30 "http://127.0.0.1:18899/api/appstore/apps/com.ictrek.v-voice?version=${VERSION}" > appstore-readback.json
          VERSION="$VERSION" python - <<'PY'
          import json, os
          value = json.load(open('appstore-readback.json'))
          data = value.get('data') or {}
          assert value.get('code') == 0 and data.get('id') == 'com.ictrek.v-voice'
          assert data.get('current_version') == os.environ['VERSION'] and data.get('app_tar_gz', {}).get('size', 0) > 0
          print('PASS: App Store published version readback', os.environ['VERSION'])
          PY

      - name: Close App Store tunnel
        if: always()
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh close
